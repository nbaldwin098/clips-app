###############################################
# MediaMTX config for Calabi Live (self-host)
# https://github.com/bluenviron/mediamtx
###############################################

logLevel: info
logDestinations: [stdout]

rtmp: yes
rtmpAddress: :1935

hls: yes
hlsAddress: :8888
hlsAlwaysRemux: yes
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M
hlsAllowOrigin: "*"

rtsp: yes
rtspAddress: :8554

webrtc: yes
webrtcAddress: :8889

# Paths — OBS publishes to rtmp://host:1935/live/<key>
paths:
  live:
    source: publisher
  ~^live/.+$:
    source: publisher
