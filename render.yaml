# Render Blueprint — Next.js (Node) for SEO SSR
# Static hosting cannot SSR watch/share pages. This service runs `next start`.
services:
  - type: web
    name: clips-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_STRIPE_PAYMENT_LINK
        sync: false
      - key: VITE_PLATFORM_OWNER_ID
        sync: false
      - key: VITE_ADMIN_CODE
        sync: false
      - key: VITE_LIVE_INGEST_CONNECTED
        sync: false
